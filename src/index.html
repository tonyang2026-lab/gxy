<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'"><title>小星桌宠</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><span>✦ 小星 · 陪伴桌宠</span><div><button id="hide" aria-label="隐藏">−</button><button id="quit" aria-label="退出">×</button></div></header>
<section class="pet"><button id="touch" aria-label="摸摸小女孩和独角兽"><img class="pet-image" src="assets/companions.png" alt="蜡笔风小女孩和粉色鬃毛独角兽，手牵手陪伴你" draggable="false"></button><p id="caption" role="status">我们一起，今天也陪着你！</p><small>点击摸摸 · 拖动标题栏移动</small></section>
<section class="needs"><label>饱食 <meter id="hunger" min="0" max="100" value="70"></meter><span id="hungerValue">70</span></label><label>精神 <meter id="energy" min="0" max="100" value="80"></meter><span id="energyValue">80</span></label></section>
<div class="actions"><button id="feed">喂食 🍪</button><button id="play">玩耍 ✨</button><button id="sleep">休息 ☾</button></div>
<form id="reminder"><label for="minutes">休息提醒（分钟）</label><div><input id="minutes" type="number" min="1" max="180" value="25" required aria-label="提醒间隔分钟"><button type="submit" id="startReminder">开始</button><button type="button" id="cancelReminder" disabled>取消</button></div></form><p id="timer" role="status">还没有设置提醒</p><details id="workflow" open><summary>工作流程 · 按步骤完成</summary>
<p id="plan-next"></p><form id="task-form"><label for="task-title">任务名称</label><input id="task-title" placeholder="例如：整理今天的资料" maxlength="120" required><div class="task-entry"><label for="task-minutes">预计分钟</label><input id="task-minutes" type="number" min="1" max="480" value="25" required><button type="submit">添加步骤</button></div></form>
<p id="plan-progress" aria-live="polite"></p><ol id="task-list"></ol><p id="work-clock" role="timer"></p><button type="button" id="pause-work">暂停计时</button><p id="plan-status" role="status"></p><small>按你排列的顺序执行；到时请手动标记完成。关闭期间计时继续，重新打开后显示结果。</small></details><footer>本地互动，无需密钥 · Ctrl + Shift + Space 呼出</footer>
</main><script src="pet-state.js"></script><script src="renderer.js"></script><script src="planner-state.js"></script><script src="planner.js"></script></body></html>
