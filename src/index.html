<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self'; script-src 'self'"><title>ASIN 竞品采集与规则评分</title><link rel="stylesheet" href="style.css"></head><body><main><section id="competitors"><h1>ASIN 竞品采集与规则评分</h1><p>读取公开商品页，无需 API 密钥。只采所选范围，规则分类须人工复核。</p><form id="competitor-form"><label>目标 ASIN 或商品链接<input id="competitor-asin" maxlength="500" required placeholder="B0XXXXXXXX"></label><label>站点<select id="competitor-market"><option value="US">美国</option><option value="UK">英国</option><option value="DE">德国</option><option value="FR">法国</option><option value="JP">日本</option><option value="AE">阿联酋（中东）</option><option value="SA">沙特阿拉伯（中东）</option></select></label><label>核心搜索词（每行1个，最多5个）<textarea id="competitor-keywords" rows="3" maxlength="510" placeholder="不填则先读取标题并生成提词建议，请核对后再采集"></textarea></label><div class="schedule-fields"><label>每词搜索页数<input id="competitor-pages" type="number" min="1" max="5" value="1" required></label><label>详情读取上限<input id="competitor-limit" type="number" min="1" max="150" value="30" required></label></div><button id="competitor-start" type="submit">开始采集</button></form><small>串行请求，间隔5秒；首次建议少量测试。遇验证码、拒绝访问或解析失败停止，保留进度，可手动继续。BSR能否采集取决于目标页提供的链接。</small><div class="competitor-actions"><button id="competitor-refresh" type="button">加载历史</button><button id="competitor-cancel" type="button" disabled>取消</button><button id="competitor-resume" type="button" disabled>继续</button><button id="competitor-export" type="button" disabled>导出Excel</button></div><select id="competitor-history" aria-label="历史采集任务"><option value="">选择历史任务</option></select><p id="competitor-status" role="status">尚未开始</p><p id="competitor-summary"></p><ul id="competitor-errors"></ul><div class="competitor-table"><table><thead><tr><th>ASIN</th><th>标题 / 规则分类</th><th>分数</th></tr></thead><tbody id="competitor-results"></tbody></table></div></section></main><script src="competitor-ui.js"></script></body></html>
