name: Build Windows long screenshot tool
on:
  workflow_dispatch:
  push:
    branches: [feat/windows-long-screenshot]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: longshot-windows-installer
          path: dist/*.exe
          if-no-files-found: error
